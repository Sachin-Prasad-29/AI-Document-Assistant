[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "langchain>=1.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py314"

# Only enable import sorting rules if explicitly needed.
[tool.ruff.lint]
select = []
ignore = []

[tool.ruff.format]
# Convert single quotes to double quotes.
quote-style = "double"

# Use 4 spaces instead of tabs.
indent-style = "space"

# Preserve existing line endings.
line-ending = "auto"

# Automatically format multiline dictionaries and collections.
# Also applies to other expressions.
skip-magic-trailing-comma = false

# Do not automatically collapse short expressions.
# Keep multiline formatting when a trailing comma is present.


